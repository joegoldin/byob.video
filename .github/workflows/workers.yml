name: Workers acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: 'true'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Required project precommit
        run: |
          cd workers
          corepack pnpm precommit
          cd ..
          git diff --exit-code
      - name: Runtime and migration acceptance
        working-directory: workers
        run: |
          corepack pnpm test:runtime
          corepack pnpm test:migration
      - name: Deployment packaging without credentials or publication
        working-directory: workers
        run: |
          corepack pnpm check:deploy
          corepack pnpm check:migration
          corepack pnpm check:production

      - name: Audit locked dependencies
        working-directory: workers
        run: corepack pnpm audit --audit-level=low
      - name: Install browser regression tools
        working-directory: workers
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          corepack pnpm exec playwright-core install --with-deps chromium firefox
          node --input-type=module -e 'import {chromium, firefox} from "playwright-core"; console.log("CHROMIUM_PATH=" + chromium.executablePath() + "\nFIREFOX_PATH=" + firefox.executablePath())' >> "$GITHUB_ENV"
      - name: Theater detent in Chromium and Firefox
        working-directory: workers
        env:
          BYOB_THEATER_ONLY: '1'
        run: |
          corepack pnpm test:browser
          BYOB_BROWSER=firefox corepack pnpm test:browser

  deploy:
    name: Deploy byob.video
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://byob.video
    concurrency:
      group: byob-production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build the tested native frontend
        working-directory: workers
        run: corepack pnpm build:web
      - name: Deploy production Worker and routes
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID repository variable'; exit 1; }
          corepack pnpm exec wrangler deploy --config wrangler.production.jsonc
      - name: Verify both production domains serve this build
        working-directory: workers
        run: node scripts/verify-deployment.mjs
